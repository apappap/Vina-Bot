[project]
name = "warehouse-nl2sql-demo"
version = "0.1.0"
description = "A guarded natural-language-to-SQL demo on mock warehouse data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["sqlglot>=30.9,<31"]

[project.optional-dependencies]
claude = ["anthropic>=1.0"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
